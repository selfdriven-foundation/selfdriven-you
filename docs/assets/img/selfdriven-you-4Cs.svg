<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 2560 1440" width="2560" height="1440">

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,800&amp;display=swap');
      text { font-family: 'Bricolage Grotesque', Georgia, serif; }
    </style>

    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="gray"/>
      <feBlend in="SourceGraphic" in2="gray" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>

    <filter id="glow-c" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feFlood flood-color="#f5c842" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-k" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feFlood flood-color="#ff5f7e" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feFlood flood-color="#00e5a0" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-l" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="b"/>
      <feFlood flood-color="#7b6cff" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="blob-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c842" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-k" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff5f7e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff5f7e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b6cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7b6cff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="div-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="div-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#08080e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#08080e" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- BASE -->
  <rect width="2560" height="1440" fill="#08080e"/>

  <!-- BLOBS -->
  <ellipse cx="500"  cy="290"  rx="680" ry="480" fill="url(#blob-c)"/>
  <ellipse cx="2060" cy="270"  rx="680" ry="480" fill="url(#blob-k)"/>
  <ellipse cx="500"  cy="1170" rx="680" ry="480" fill="url(#blob-l)"/>
  <ellipse cx="2060" cy="1170" rx="680" ry="480" fill="url(#blob-b)"/>

  <!-- GRID -->
  <g opacity="0.03" stroke="#fff" stroke-width="1" fill="none">
    <line x1="320"  y1="0" x2="320"  y2="1440"/>
    <line x1="640"  y1="0" x2="640"  y2="1440"/>
    <line x1="960"  y1="0" x2="960"  y2="1440"/>
    <line x1="1600" y1="0" x2="1600" y2="1440"/>
    <line x1="1920" y1="0" x2="1920" y2="1440"/>
    <line x1="2240" y1="0" x2="2240" y2="1440"/>
    <line x1="0" y1="360"  x2="2560" y2="360"/>
    <line x1="0" y1="1080" x2="2560" y2="1080"/>
  </g>

  <!-- DIVIDERS -->
  <rect x="0"    y="717" width="2560" height="3" fill="url(#div-h)"/>
  <rect x="1278" y="0"   width="3" height="1440" fill="url(#div-v)"/>

  <!-- ═══════════════════════════
       TOP-LEFT  ·  CURIOUS
       ═══════════════════════════ -->

  <!-- Ghost number -->
  <text x="56" y="620" font-size="560" font-weight="800" fill="#f5c842" fill-opacity="0.055"
        letter-spacing="-0.06em">01</text>

  <!-- Icon -->
  <g transform="translate(80, 76)">
    <rect x="0" y="22" width="110" height="28" rx="6" fill="none" stroke="#f5c842" stroke-width="3" opacity="0.9"/>
    <circle cx="124" cy="36" r="18" fill="none" stroke="#f5c842" stroke-width="3" opacity="0.9"/>
    <line x1="14" y1="50" x2="0"  y2="88" stroke="#f5c842" stroke-width="2.5" opacity="0.7"/>
    <line x1="55" y1="50" x2="44" y2="88" stroke="#f5c842" stroke-width="2.5" opacity="0.7"/>
    <line x1="96" y1="50" x2="110" y2="88" stroke="#f5c842" stroke-width="2.5" opacity="0.7"/>
    <rect x="-14" y="30" width="18" height="14" rx="3" fill="none" stroke="#f5c842" stroke-width="2" opacity="0.8"/>
    <circle cx="170" cy="14" r="3.5" fill="#f5c842" opacity="0.7"/>
    <circle cx="200" cy="44" r="2.5" fill="#f5c842" opacity="0.5"/>
    <circle cx="155" cy="62" r="2"   fill="#f5c842" opacity="0.4"/>
  </g>

  <!-- Eyebrow -->
  <text x="80" y="196" font-size="12" font-weight="700" fill="#f5c842" fill-opacity="0.75"
        letter-spacing="0.2em">01 — CURIOSITY</text>

  <!-- Mode word -->
  <text x="68" y="378" font-size="220" font-weight="800" fill="#f5c842" fill-opacity="0.96"
        letter-spacing="-0.05em" filter="url(#glow-c)">Curious</text>

  <!-- Tagline -->
  <text x="80" y="432" font-size="21" font-weight="300" fill="#f5c842" fill-opacity="0.52"
        letter-spacing="0.03em">The ignition system of intelligence.</text>

  <!-- Pills -->
  <g transform="translate(80,464)">
    <rect width="216" height="34" rx="17" fill="#f5c842" fill-opacity="0.11" stroke="#f5c842" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#f5c842" fill-opacity="0.8">Ask better questions</text>
  </g>
  <g transform="translate(308,464)">
    <rect width="166" height="34" rx="17" fill="#f5c842" fill-opacity="0.11" stroke="#f5c842" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#f5c842" fill-opacity="0.8">Explore freely</text>
  </g>
  <g transform="translate(486,464)">
    <rect width="196" height="34" rx="17" fill="#f5c842" fill-opacity="0.11" stroke="#f5c842" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#f5c842" fill-opacity="0.8">Notice assumptions</text>
  </g>

  <!-- Corner dot -->
  <circle cx="1261" cy="703" r="11" fill="#f5c842" opacity="0.88"/>

  <!-- ═══════════════════════════
       TOP-RIGHT  ·  CARING
       ═══════════════════════════ -->

  <text x="1306" y="620" font-size="560" font-weight="800" fill="#ff5f7e" fill-opacity="0.055"
        letter-spacing="-0.06em">02</text>

  <g transform="translate(1330, 72)">
    <path d="M75 95 C75 95 0 55 0 22 C0 9 11 0 23 0 C36 0 52 9 75 28 C98 9 114 0 127 0 C139 0 150 9 150 22 C150 55 75 95 75 95Z"
          fill="none" stroke="#ff5f7e" stroke-width="3.5" stroke-linejoin="round" opacity="0.9"/>
    <path d="M186 18 C186 18 178 12 178 6 C178 2 181 0 184.5 0 C186.5 0 188 2 189.5 4 C191 2 192.5 0 194.5 0 C198 0 201 2 201 6 C201 12 193.5 18 189.5 18Z"
          fill="#ff5f7e" fill-opacity="0.45"/>
  </g>

  <text x="1330" y="196" font-size="12" font-weight="700" fill="#ff5f7e" fill-opacity="0.75"
        letter-spacing="0.2em">02 — CARING</text>

  <text x="1318" y="378" font-size="220" font-weight="800" fill="#ff5f7e" fill-opacity="0.96"
        letter-spacing="-0.05em" filter="url(#glow-k)">Caring</text>

  <text x="1330" y="432" font-size="21" font-weight="300" fill="#ff5f7e" fill-opacity="0.52"
        letter-spacing="0.03em">What keeps intelligence human.</text>

  <g transform="translate(1330,464)">
    <rect width="148" height="34" rx="17" fill="#ff5f7e" fill-opacity="0.11" stroke="#ff5f7e" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#ff5f7e" fill-opacity="0.8">Listen deeply</text>
  </g>
  <g transform="translate(1490,464)">
    <rect width="208" height="34" rx="17" fill="#ff5f7e" fill-opacity="0.11" stroke="#ff5f7e" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#ff5f7e" fill-opacity="0.8">Contribute freely</text>
  </g>
  <g transform="translate(1710,464)">
    <rect width="188" height="34" rx="17" fill="#ff5f7e" fill-opacity="0.11" stroke="#ff5f7e" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#ff5f7e" fill-opacity="0.8">Create safety</text>
  </g>

  <circle cx="1299" cy="703" r="11" fill="#ff5f7e" opacity="0.88"/>

  <!-- ═══════════════════════════
       BOTTOM-LEFT  ·  CHILL
       ═══════════════════════════ -->

  <text x="56" y="1390" font-size="560" font-weight="800" fill="#7b6cff" fill-opacity="0.055"
        letter-spacing="-0.06em">04</text>

  <g transform="translate(80, 762)">
    <path d="M0 18 C28 18 28 0 56 0 C84 0 84 18 112 18 C140 18 140 0 168 0 C196 0 196 18 224 18"
          fill="none" stroke="#7b6cff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M0 42 C28 42 28 24 56 24 C84 24 84 42 112 42 C140 42 140 24 168 24 C196 24 196 42 224 42"
          fill="none" stroke="#7b6cff" stroke-width="2.8" stroke-linecap="round" opacity="0.65"/>
    <path d="M0 64 C28 64 28 46 56 46 C84 46 84 64 112 64 C140 64 140 46 168 46 C196 46 196 64 224 64"
          fill="none" stroke="#7b6cff" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  </g>

  <text x="80" y="886" font-size="12" font-weight="700" fill="#7b6cff" fill-opacity="0.75"
        letter-spacing="0.2em">04 — CHILL</text>

  <text x="68" y="1068" font-size="220" font-weight="800" fill="#7b6cff" fill-opacity="0.96"
        letter-spacing="-0.05em" filter="url(#glow-l)">Chill</text>

  <text x="80" y="1122" font-size="21" font-weight="300" fill="#7b6cff" fill-opacity="0.52"
        letter-spacing="0.03em">Nervous system sustainability.</text>

  <g transform="translate(80,1154)">
    <rect width="176" height="34" rx="17" fill="#7b6cff" fill-opacity="0.11" stroke="#7b6cff" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#7b6cff" fill-opacity="0.8">Rest without guilt</text>
  </g>
  <g transform="translate(268,1154)">
    <rect width="174" height="34" rx="17" fill="#7b6cff" fill-opacity="0.11" stroke="#7b6cff" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#7b6cff" fill-opacity="0.8">Unstructured time</text>
  </g>
  <g transform="translate(454,1154)">
    <rect width="148" height="34" rx="17" fill="#7b6cff" fill-opacity="0.11" stroke="#7b6cff" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#7b6cff" fill-opacity="0.8">Protect sleep</text>
  </g>

  <circle cx="1261" cy="737" r="11" fill="#7b6cff" opacity="0.88"/>

  <!-- ═══════════════════════════
       BOTTOM-RIGHT  ·  CONSTRUCTIVE
       ═══════════════════════════ -->

  <text x="1306" y="1390" font-size="560" font-weight="800" fill="#00e5a0" fill-opacity="0.055"
        letter-spacing="-0.06em">03</text>

  <g transform="translate(1330, 758)">
    <rect x="14" y="14" width="68" height="34" rx="6" fill="none" stroke="#00e5a0" stroke-width="3.5" opacity="0.9"/>
    <line x1="48" y1="48" x2="78" y2="95" stroke="#00e5a0" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
    <line x1="4"  y1="8"  x2="-4" y2="0"  stroke="#00e5a0" stroke-width="2.5" opacity="0.5"/>
    <line x1="22" y1="4"  x2="18" y2="-6" stroke="#00e5a0" stroke-width="2"   opacity="0.4"/>
    <line x1="42" y1="2"  x2="42" y2="-8" stroke="#00e5a0" stroke-width="2"   opacity="0.3"/>
  </g>

  <text x="1330" y="886" font-size="12" font-weight="700" fill="#00e5a0" fill-opacity="0.75"
        letter-spacing="0.2em">03 — CONSTRUCTIVE</text>

  <!-- Constructive is long — use 155px -->
  <text x="1318" y="1068" font-size="155" font-weight="800" fill="#00e5a0" fill-opacity="0.96"
        letter-spacing="-0.04em" filter="url(#glow-b)">Constructive</text>

  <text x="1330" y="1122" font-size="21" font-weight="300" fill="#00e5a0" fill-opacity="0.52"
        letter-spacing="0.03em">Turns potential into reality.</text>

  <g transform="translate(1330,1154)">
    <rect width="168" height="34" rx="17" fill="#00e5a0" fill-opacity="0.11" stroke="#00e5a0" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#00e5a0" fill-opacity="0.8">Build useful things</text>
  </g>
  <g transform="translate(1510,1154)">
    <rect width="152" height="34" rx="17" fill="#00e5a0" fill-opacity="0.11" stroke="#00e5a0" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#00e5a0" fill-opacity="0.8">Create clarity</text>
  </g>
  <g transform="translate(1674,1154)">
    <rect width="164" height="34" rx="17" fill="#00e5a0" fill-opacity="0.11" stroke="#00e5a0" stroke-width="1" stroke-opacity="0.28"/>
    <text x="16" y="22" font-size="13" font-weight="600" fill="#00e5a0" fill-opacity="0.8">Share knowledge</text>
  </g>

  <circle cx="1299" cy="737" r="11" fill="#00e5a0" opacity="0.88"/>

  <!-- ═══════════════════════════
       CENTRE RING
       ═══════════════════════════ -->

  <!-- Dashed guide ring -->
  <circle cx="1280" cy="720" r="192" fill="none" stroke="#ffffff" stroke-width="1"
          stroke-opacity="0.06" stroke-dasharray="5 9"/>

  <!-- Four arcs — cx=1280 cy=720 r=188 -->
  <!-- top=(1280,532) right=(1468,720) bottom=(1280,908) left=(1092,720) -->

  <!-- Curious:    top→right -->
  <path d="M 1280 532 A 188 188 0 0 1 1468 720"
        fill="none" stroke="#f5c842" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Caring:     right→bottom -->
  <path d="M 1468 720 A 188 188 0 0 1 1280 908"
        fill="none" stroke="#ff5f7e" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Constructive: bottom→left -->
  <path d="M 1280 908 A 188 188 0 0 1 1092 720"
        fill="none" stroke="#00e5a0" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Chill:      left→top -->
  <path d="M 1092 720 A 188 188 0 0 1 1280 532"
        fill="none" stroke="#7b6cff" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Cardinal dots -->
  <circle cx="1280" cy="532" r="11" fill="#f5c842"/>
  <circle cx="1468" cy="720" r="11" fill="#ff5f7e"/>
  <circle cx="1280" cy="908" r="11" fill="#00e5a0"/>
  <circle cx="1092" cy="720" r="11" fill="#7b6cff"/>

  <!-- Dot glow halos -->
  <circle cx="1280" cy="532" r="22" fill="#f5c842" fill-opacity="0.18"/>
  <circle cx="1468" cy="720" r="22" fill="#ff5f7e" fill-opacity="0.18"/>
  <circle cx="1280" cy="908" r="22" fill="#00e5a0" fill-opacity="0.18"/>
  <circle cx="1092" cy="720" r="22" fill="#7b6cff" fill-opacity="0.18"/>

  <!-- Centre fill -->
  <circle cx="1280" cy="720" r="92" fill="#08080e"/>
  <circle cx="1280" cy="720" r="92" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- Centre label -->
  <text x="1280" y="707" font-size="11" font-weight="600" fill="#ffffff" fill-opacity="0.35"
        text-anchor="middle" letter-spacing="0.22em">THE</text>
  <text x="1280" y="727" font-size="22" font-weight="800" fill="#ffffff" fill-opacity="0.82"
        text-anchor="middle" letter-spacing="0.06em">HUMAN</text>
  <text x="1280" y="746" font-size="11" font-weight="600" fill="#ffffff" fill-opacity="0.35"
        text-anchor="middle" letter-spacing="0.22em">RHYTHM</text>

  <!-- ═══════════════════════════
       BRANDING FOOTER
       ═══════════════════════════ -->
  <text x="1280" y="1408" font-size="16" font-weight="400" fill="#ffffff" fill-opacity="0.2"
        text-anchor="middle" letter-spacing="0.24em">SELFDRIVEN.YOU — CURIOUS · CARING · CONSTRUCTIVE · CHILL</text>

  <!-- VIGNETTE -->
  <rect width="2560" height="1440" fill="url(#vignette)"/>

  <!-- GRAIN OVERLAY -->
  <rect width="2560" height="1440" fill="#08080e" opacity="0.0001" filter="url(#grain)"/>

</svg>